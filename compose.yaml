services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expenses"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    image: expense-tracker-api:${IMAGE_TAG:-local}
    environment:
      DB_URL: jdbc:postgresql://db:5432/expenses
      DB_USERNAME: expense
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
